name: deploy react

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - run: docker build -t sayedoynat/docker-react -f Dockerfile.dev .
      - run: docker run -e CI=true sayedoynat/docker-react npm run test

      - run: docker build -t sayedoynat/multi-client ./microservices/client 
      - run: docker build -t sayedoynat/multi-nginx ./microservices/nginx
      - run: docker build -t sayedoynat/multi-server ./microservices/server
      - run: docker build -t sayedoynat/multi-worker ./microservices/worker
      - run: docker push sayedoynat/multi-client
      - run: docker push sayedoynat/multi-nginx
      - run: docker push sayedoynat/multi-server 
      - run: docker push sayedoynat/multi-worker


      
