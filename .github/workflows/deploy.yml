name: Deploy react 
on:
  push:
    branches:
        - master
jobs:
   build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - run: docker build -t sayedoynat/react-app -f dockerfile.dev .
      - run: docker run -e CI=true sayedoynat/react-app npm run test